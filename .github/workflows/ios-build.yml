# Compila DBus V2 para iPhone en un Mac de GitHub (no hace falta Mac propio).
#
# Resultado: un .ipa SIN firmar publicado como Release del repositorio.
# Enlace fijo a la última versión (ábrelo desde Safari en el iPhone):
#   https://github.com/<usuario>/<repo>/releases/latest/download/DBus.ipa
# SideStore lo firma con tu Apple ID al instalarlo.

name: iOS build (.ipa)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: write # necesario para publicar la Release con el .ipa

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26 # Xcode 26 → SDK de iOS 26 (Liquid Glass)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Usar el Xcode estable más reciente del runner
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi -E 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Generar el proyecto nativo de iOS (Expo prebuild)
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Compilar en Release (sin firmar)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE · Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Errores del compilador"
              grep -n -B4 -A12 -E "error:|fatal error" build.log | head -400
              echo "::endgroup::"
              tail -n 30 build.log
              exit 1
            }
          tail -n 5 build.log

      - name: Guardar log completo si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Empaquetar .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DBus.ipa Payload
          ls -lh DBus.ipa

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DBus-ipa-${{ github.run_number }}
          path: DBus.ipa
          retention-days: 14

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DBus V2 · build ${{ github.run_number }}
          body: |
            .ipa sin firmar generado desde ${{ github.sha }}.
            Instálalo en el iPhone con SideStore (lo firma con tu Apple ID).
          files: DBus.ipa
          make_latest: true
